name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一PRやブランチでの連続プッシュ時に古いジョブを自動キャンセルしてリソースを節約
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    # プロセスのハングやデッドロックによる長時間のランナー占有・課金暴走を防止
    timeout-minutes: 15
    # Windows runner でも Bash を統一使用しシェル挙動の差異を吸収
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # テスト実行前にプロダクション成果物をビルドし、配布物検証テスト等がビルド済み成果物を前提に動けるようにする
      - name: Build artifacts
        run: npm run build

      - name: Run tests
        run: npm test

      # tsxではなくビルド済み本番バイナリ（dist/cli/index.js）を直接実行してドキュメントを検証
      - name: Dogfooding build docs
        run: node dist/cli/index.js build --config ./mkdocsgen.yml --clean

  perf:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run performance tests
        run: npm run test:perf
